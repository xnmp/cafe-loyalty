# Compiles the iOS app for the simulator (unsigned), launches it and saves a
# screenshot: proof the iOS build works without a local Mac. The simulator has no NFC, so tapping still needs a real iPhone
# (docs/RELEASE.md §7). Runs on demand: Actions tab → iOS simulator build → Run.
# With "screenshots" ticked it also captures the App Store screenshots
# (e2e/app-store-screenshots/); docs/RELEASE.md §5 says what to do with them.
name: iOS simulator build

on:
  workflow_dispatch:
    inputs:
      screenshots:
        description: Also capture the App Store screenshots
        type: boolean
        default: false

# macOS minutes are billed at 10x: never run two of these at once.
concurrency:
  group: ios-simulator
  cancel-in-progress: true

jobs:
  build:
    # Expo SDK 58 needs Xcode 26.4+; this image defaults to a newer 26.x.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Stamps need a key the app trusts. This one exists only inside this run:
      # it's never committed or uploaded, and the build that trusts it is thrown away.
      - name: Make a throwaway signing key for the screenshots
        if: inputs.screenshots
        run: bun run setup-cafe new-key > /dev/null

      - name: Generate the iOS project
        run: bunx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      # The Xcode project is named after the app (cafe.config.json shortName).
      - name: Build for the simulator
        run: |
          PROJECT=$(basename ios/*.xcworkspace .xcworkspace)
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          xcodebuild -version
          xcodebuild -workspace "ios/$PROJECT.xcworkspace" -scheme "$PROJECT" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 \
            || { grep -E "error:" xcodebuild.log | head -50; tail -80 xcodebuild.log; exit 1; }
          tail -3 xcodebuild.log

      - name: Check the NFC configuration made it into the app
        run: |
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          plutil -p "$APP/Info.plist" | grep -A3 -E 'NFCReaderUsageDescription|iso7816.select-identifiers'
          grep -A4 'nfc.readersession.formats' "ios/$PROJECT/$PROJECT.entitlements"

      # Deep links can't open other screens here: the simulator stops at an
      # "Open in …?" prompt that only a tap dismisses.
      - name: Launch and screenshot
        run: |
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          # The biggest iPhone: App Store Connect wants 6.9" screenshots and scales them down for the rest.
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))] | (map(select(.name | test("Pro Max"))) + .) | .[0].udid')
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          echo "device $DEVICE, bundle $BUNDLE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 25
          xcrun simctl io "$DEVICE" screenshot card.png
          # Still running after launch means it didn't crash on start-up.
          xcrun simctl spawn "$DEVICE" launchctl list | grep "$BUNDLE"

      - uses: actions/setup-java@v4
        if: inputs.screenshots
        with:
          distribution: temurin
          java-version: '17'

      - name: Capture the App Store screenshots
        if: inputs.screenshots
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          export PATH="$PATH:$HOME/.maestro/bin"
          maestro --version
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          mkdir -p app-store
          # Links are only valid for 15 minutes, so each is made just before use.
          maestro --device "$DEVICE" test e2e/app-store-screenshots/1-start.yaml -e STAMP5="$(bun scripts/dev-token.ts stamp 5)"
          # The "Stamp added" sheet closes itself after 2.6 s, but Maestro's openLink waits
          # for the screen to settle first, so this shot is taken from here.
          xcrun simctl openurl "$DEVICE" "$(bun scripts/dev-token.ts stamp 1)"
          sleep 1.2
          # No Dynamic Island cut-out, like Maestro's own screenshots.
          xcrun simctl io "$DEVICE" screenshot --mask=ignored app-store/02-stamp-added.png
          maestro --device "$DEVICE" test e2e/app-store-screenshots/2-rest.yaml --test-output-dir maestro-out \
            -e STAMP3="$(bun scripts/dev-token.ts stamp 3)"
          find maestro-out -name '0[0-9]-*.png' -exec cp {} app-store/ \;
          for f in app-store/*.png; do sips -g pixelWidth -g pixelHeight "$f" | tr '\n' ' '; echo; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            *.png
            app-store/*.png
            xcodebuild.log
            ~/.maestro/tests/**/*
            maestro-out/**/*
          if-no-files-found: warn
