# Compiles the iOS app for the simulator (unsigned), launches it, opens a
# couple of screens and saves screenshots: proof the iOS build works without a
# local Mac. The simulator has no NFC, so tapping still needs a real iPhone
# (docs/RELEASE.md §7). Runs on demand: Actions tab → iOS simulator build → Run.
name: iOS simulator build

on:
  workflow_dispatch:

# macOS minutes are billed at 10x: never run two of these at once.
concurrency:
  group: ios-simulator
  cancel-in-progress: true

jobs:
  build:
    # Expo SDK 58 needs Xcode 26.4+; this image defaults to a newer 26.x.
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate the iOS project
        run: bunx expo prebuild --platform ios --no-install

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Build for the simulator
        run: |
          xcodebuild -version
          xcodebuild -workspace ios/CornerCafe.xcworkspace -scheme CornerCafe -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build > xcodebuild.log 2>&1 \
            || { grep -E "error:" xcodebuild.log | head -50; tail -80 xcodebuild.log; exit 1; }
          tail -3 xcodebuild.log

      - name: Check the NFC configuration made it into the app
        run: |
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          plutil -p "$APP/Info.plist" | grep -A3 -E 'NFCReaderUsageDescription|iso7816.select-identifiers'
          grep -A4 'nfc.readersession.formats' ios/CornerCafe/CornerCafe.entitlements

      - name: Launch, open screens, screenshot
        run: |
          APP=$(find build/Build/Products/Release-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          BUNDLE=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")
          DEVICE=$(xcrun simctl list devices available -j | jq -r '[.devices | to_entries[] | select(.key | test("iOS")) | .value[] | select(.name | test("^iPhone"))][0].udid')
          echo "device $DEVICE, bundle $BUNDLE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" "$BUNDLE"
          sleep 25
          xcrun simctl io "$DEVICE" screenshot 1-card.png
          # Still running after launch means it didn't crash on start-up.
          xcrun simctl spawn "$DEVICE" launchctl list | grep "$BUNDLE"
          xcrun simctl openurl "$DEVICE" cornercafe://about
          sleep 6
          xcrun simctl io "$DEVICE" screenshot 2-about.png
          xcrun simctl openurl "$DEVICE" cornercafe://history
          sleep 6
          xcrun simctl io "$DEVICE" screenshot 3-history.png
          xcrun simctl spawn "$DEVICE" launchctl list | grep "$BUNDLE"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator
          path: |
            *.png
            xcodebuild.log
          if-no-files-found: warn
