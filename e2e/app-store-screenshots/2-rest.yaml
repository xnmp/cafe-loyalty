# App Store screenshots, part 2 of 2: carries on from the card with 5 stamps.
#   STAMP3: a stamp link from `bun scripts/dev-token.ts stamp 3`
# Screenshots land in Maestro's --test-output-dir (it refuses paths outside it).
appId: md.chong.cafecard
---
# The "Stamp added" sheet closes itself after 2.6 s, and openLink waits longer
# than that for the screen to settle. So the workflow opens this stamp link
# itself once the "ready" marker appears, while this waits for the sheet.
- takeScreenshot: ready
# Once the simulator took 50 s to hand the link over.
- extendedWaitUntil:
    visible: "Stamp added"
    timeout: 120000
# No waitForAnimationToEnd here: the card's ripple never stops, so it runs for
# about 15 s whatever its timeout says, and the sheet is gone by then. One more
# hierarchy check (about 0.6 s) lets the sheet finish sliding in. The early
# shot stays in the run's artifact as a fallback; only 02-* is copied.
- takeScreenshot: early-02-stamp-added
- runFlow:
    when:
      visible: "Stamp added"
    commands:
      - takeScreenshot: 02-stamp-added
# Maestro counts a notVisible timeout from its last tap or link, and this flow
# has none yet, so it has to cover the wait above too.
- extendedWaitUntil:
    notVisible: "Stamp added"
    timeout: 150000
- extendedWaitUntil:
    visible: ".*6 of 9 stamps.*"
    timeout: 5000
- waitForAnimationToEnd
- takeScreenshot: 01-card

- openLink: ${STAMP3}
- runFlow:
    when:
      visible: "Open"
    commands:
      - tapOn:
          text: "Open"
          waitToSettleTimeoutMs: 300
- extendedWaitUntil:
    visible: "Lovely"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 03-unlocked
- tapOn: "Lovely"
# The simulator once lost this tap in one run out of four (traced: when a tap
# arrives, the sheet closes), so try once more rather than fail the run.
- runFlow:
    when:
      visible: "Lovely"
    commands:
      - tapOn: "Lovely"
# The ticket's accessibility label replaces its visible text, so find it by ID.
- extendedWaitUntil:
    visible:
      id: "reward-ticket"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 04-reward-ready

- tapOn: "History"
- extendedWaitUntil:
    visible: "Member since.*"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 07-history
